title: Business AI and Analytics Centre
subtitle: Durham University Business School
description: Research on artificial intelligence, analytics, operations research and data-driven decision-making at Durham University Business School.
url: https://business-ai-analytics-centre.github.io
baseurl: ""
locale: en-GB
timezone: Europe/London
remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: default

include:
  - _pages

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from

markdown: kramdown
permalink: /:categories/:title/
search: false
breadcrumbs: false
masthead_title: BAIAC

defaults:
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      classes: wide
      author_profile: false
      read_time: false

repository: Business-AI-Analytics-Centre/business-ai-analytics-centre.github.io
github: [metadata]
centre_email: ""
